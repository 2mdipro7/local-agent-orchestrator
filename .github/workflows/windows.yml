name: Windows validation
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.10'
      - name: Test without provider accounts
        run: python -m unittest discover -s tests -v
      - name: Install build tools
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt
      - name: Build Windows executables
        run: python build_windows.py
      - name: Smoke test packaged application
        run: python smoke_windows.py
      - name: Package public files
        run: python package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview
          path: release/*
          if-no-files-found: error
          retention-days: 14
